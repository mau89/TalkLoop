name: AI review · Day 32

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit or ref
        required: true
      head_sha:
        description: Head commit or ref
        required: true

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: talkloop-review-mac
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
    steps:
      - name: Checkout PR history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test review pipeline
        run: python -m unittest discover -s tools/day32 -v

      - name: Check local Ollama
        run: |
          if ! curl --fail --silent --max-time 3 http://127.0.0.1:11434/api/version > /dev/null; then
            open -gj -a Ollama
          fi
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:11434/api/version; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:11434/api/version
          ollama show qwen3.5:9b-q8_0 > /dev/null

      - name: Review PR with documentation and code RAG
        env:
          REVIEW_MODEL: qwen3.5:9b-q8_0
        run: >-
          python tools/day32/review_pr.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --provider ollama --model "$REVIEW_MODEL" --output day32-data

      - name: Show review in the run summary
        if: always()
        run: |
          if [ -f day32-data/review.md ]; then
            cat day32-data/review.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save review and retrieval trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            day32-data/review.md
            day32-data/review.json
            day32-data/context.json
            day32-data/batches.json
            day32-data/model-replies.json
          if-no-files-found: warn
          retention-days: 14
